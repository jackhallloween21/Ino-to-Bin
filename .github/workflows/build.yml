name: Build firmware and publish site

on:
  push:
    branches: [main]
    paths:
      - "sketches/**"
      - "ino2bin.py"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built-count: ${{ steps.compile.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure board manager URLs
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Update index and install board cores
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli core install esp32:esp32

      - name: Install common libraries
        # Add any other libraries your sketches need here.
        run: |
          arduino-cli lib install "Blynk"
          arduino-cli lib install "DHT sensor library"

      - name: Compile every sketch
        id: compile
        run: |
          mkdir -p build docs/downloads
          count=0
          for sketch_dir in sketches/*/; do
            name=$(basename "$sketch_dir")
            for board in esp8266:esp8266:nodemcuv2 esp32:esp32:esp32; do
              board_label=$(echo "$board" | cut -d: -f1)
              out="build/${name}_${board_label}"
              echo "::group::Compiling $name for $board_label"
              if python3 ino2bin.py --sketch "$sketch_dir" --board "$board" --output-dir "$out"; then
                bin_file=$(find "$out" -name "*.bin" | head -n1)
                if [ -n "$bin_file" ]; then
                  cp "$bin_file" "docs/downloads/${name}_${board_label}.bin"
                  count=$((count+1))
                fi
              else
                echo "::warning::Skipping $name for $board_label — see log above for the error."
              fi
              echo "::endgroup::"
            done
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Generate download page
        run: python3 scripts/generate_index.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
